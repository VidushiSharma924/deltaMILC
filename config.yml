# =============================================================================
# dMILC Configuration File
# Differentiable MILC hydrological model (dPL + MILC)
# =============================================================================

# --- Data ---
data:
  root_db: "CAMELS_IND/CAMELS_IND_Catchments_Streamflow_No_Nan"                 
  forcing_root: "CAMELS_IND/CAMELS_IND_Catchments_Streamflow_No_Nan/catchment_mean_forcings"
  subset_file: "CAMELS_IND/Train.txt" 
  flow_path: "CAMELS_IND/CAMELS_IND_Catchments_Streamflow_No_Nan/streamflow_timeseries/final_filled.csv"
  attr_path: "CAMELS_IND/CAMELS_IND_Catchments_Streamflow_No_Nan/attributes_txt/camels_ind_attributes.csv"
  train_cache: "training_file"          
  val_cache:   "validation_file"               
  train_period: [19921001, 20081001]
  val_period:   [19861001, 19921001]
  forcing_vars:
  - prcp(mm/day)
  - tmax(C)
  - tmin(C)
  - tavg(C)
  - srad_sw(w/m2)
  - wind(m/s)
  - rel_hum(%)
  attr_vars:
