  rebuild_cache: true                  

# --- Model ---
model:
  name: "δMILC-DP_1.0"                    
  n_components: 16                      # Nmul — parallel HRU components
  hidden_size: 256                      # LSTM hidden size
  lstm_dropout: 0.4                     # input dropout on LSTM encoder
  n_physics_params: 8                   # MILC has 8 physical parameters (gamma,m,ks,nu,alpha,w0,wmax,kc)
  component_weights: false              # weighted avg of components (false = simple mean)
  precip_correction: false              # learned precipitation correction
  dynamic_params: true                  # time-varying physics params from per-timestep LSTM output
  static_pm_params: true                # true = one rs/albedo/hc set repeated over time; false = per-timestep PM params

# --- Training ---
train:
  epochs: 1
  batch_size: 10000                     # basins per mini-batch
  seq_len: 365                          # RHO — LSTM sequence length (days)
  warmup: 365                           # BUFFTIME — physics spin-up days
  save_every: 1                         # save checkpoint every N epochs
  optimizer: "adam"                     # "adam" or "adadelta"
  lr: 5.0e-4
  lr_scheduler: "cosine"               # "cosine" or "none"
  lr_min: 1.0e-6
  grad_clip: 1.0                       # gradient norm clipping (0 = disabled)
  resume: false                        # auto-resume from latest checkpoint if found
  gpu: 1
  seed: 111111

# --- Loss ---
loss:
  name: "nse_kge"                      # "nse_kge" | "kge_batch" | "nse_batch" | "rmse_comb"
  eps: 0.1                             # epsilon for NSE/KGE denominators
  nse_weight: 0                        # for nse_kge: 0=pure KGE, 1=pure NSE, 0.5=equal blend
  rmse_alpha: 0.25                     # weight for log-sqrt RMSE (only for rmse_comb)

# --- Output ---
output:
  root: "experiments"                  # relative to root_db
  run_name: MILC-DP_1.0_India_Train1

# --- Evaluation ---
eval:
  epoch: 1                           # which checkpoint to load for testing
  batch_size: 10000                    # basins per test batch
  warmup: 0                            # no additional warmup at test time (use val_period start)
  skip_warmup_years: 3                 # skip first N years of val period as warmup
  checkpoint: experiments/MILC-DP_1.0_India_Train1/model_best.pt