  - urban_frac_2005
  - crops_frac_1985
  - crops_frac_1995
  - crops_frac_2005
  - p_mean
  - p_max
  - p_mean_anum
  - p_monthly_variability
  - p_annual_variability
  - p_unif
  - high_prec_freq
  - high_prec_dur
  - max_high_prec_dur
  - low_prec_freq
  - low_prec_dur
  - max_low_prec_dur
  - asynchronicity
  - tmin_mean
  - tmax_mean
  - pet_mean
  - pet_min
  - pet_max
  - pet_mean_anum
  - pet_gleam_mean
  - aet_gleam_mean
  - evap_canopy_mean
  - evap_canopy_min
  - evap_canopy_max
  - evap_canopy_anum
  - evap_surface_mean
  - evap_surface_min
  - evap_surface_max
  - evap_surface_anum
  - aridity_p_pet
  - aridity_pet_aet
  - ai_mean
  - rel_hum_mean
  - srad_lw_mean
  - srad_sw_mean
  - wind_mean
  - sm_lvl1_mean
  - sm_lvl2_mean
  - sm_lvl3_mean
  - sm_lvl4_mean
  - geol_porosity
  - geol_permeability
  - geol_class_1st_frac
  - geol_class_2nd_frac
  - carb_rocks_frac
  - water_frac
  - trees_frac
  - flooded_veg_frac
  - crops_frac
  - built_area_frac
  - bare_frac
  - range_frac
